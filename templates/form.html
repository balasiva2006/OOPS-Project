{% extends 'base.html' %}
{% block content %}
    <section class="card narrow">
        <h1>{{ title }}</h1>
        {% if note %}
            <p class="muted">{{ note }}</p>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            {% for name,label,type,choices in fields %}
                <label>
                    {{ label }}
                    {% if type=='textarea' %}
                        <textarea name="{{ name }}" rows="4" required maxlength="3000"></textarea>
                    {% elif type=='select' %}
                        <select name="{{ name }}" required>
                            <option value="">Choose…</option>
                            {% for value,text in choices %}
                                <option value="{{ value }}">{{ text }}</option>
                            {% endfor %}
                        </select>
                    {% else %}
                        <input
                            name="{{ name }}"
                            type="{{ type }}"
                            required
                            {% if type == 'number' %}
                                min="0"
                                step="0.01"
                                max="10000000"
                            {% endif %}
                            {% if type == 'month' %}
                                value="{{ current_month }}"
                            {% endif %}
                            {% if type == 'file' %}
                                accept="{{ 'image/png,image/jpeg' if name == 'photo' else 'image/png,image/jpeg,application/pdf' }}"
                            {% endif %}
                        >
                    {% endif %}
                </label>
            {% endfor %}
            <div class="actions">
                <button>Save</button>
                <a href="{{ url_for(back) }}">Back</a>
            </div>
        </form>
    </section>
{% endblock %}
