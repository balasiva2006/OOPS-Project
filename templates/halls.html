{% extends 'base.html' %}
{% block content %}
    <h1>Halls</h1>
    {% if user.role=='admin' %}
        <details class="card">
            <summary>Add a hall</summary>
            <form method="post" class="form-grid">
                <input type="hidden" name="csrf" value="{{ csrf }}">
                <label>
                    Hall name
                    <input name="name" required>
                </label>
                <label>
                    Monthly amenity charge per student (Rs.)
                    <input name="amenity" type="number" min="0" step="0.01" required>
                </label>
                <label>
                    Amenities
                    <input name="amenities" placeholder="Reading room, TV room, play room" required>
                </label>
                <button>Add hall</button>
            </form>
        </details>
    {% endif %}
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Hall</th>
                    <th>Amenities</th>
                    <th>Monthly amenity charge</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rows %}
                    <tr>
                        <td>{{ r.name }}</td>
                        <td>{{ r.amenities }}</td>
                        <td>{{ r.amenity|rupees }}</td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="3">No halls yet.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
